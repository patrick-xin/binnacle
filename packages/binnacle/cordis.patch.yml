# The binnacle bundle, stacked by a profile over dsh-base.
#
# binnacle holds the terminal for the life of the process, so a
# configuration reload must not swap rows under a live frame: HMR is off,
# as it is in dsh's own direct-driver bundles (headless, ACP, SDK).
- id: hmr
  disabled: true

- insert:
    - id: binnacle
      name: 'binnacle'
    # binnacle's built-in features, each a row of its own so a person can
    # remove one as they remove any dsh plugin: disable it by its id in their
    # own profile's patch (`- id: binnacle-status-line` / `disabled: true`).
    # Approvals and Questions are not rows: the host applies them on a scope
    # of the session's agent, which a row cannot be bound to.
    - id: binnacle-transcript
      name: 'binnacle/plugins/transcript'
    - id: binnacle-composer
      name: 'binnacle/plugins/composer'
    - id: binnacle-status-line
      name: 'binnacle/plugins/status-line'
    - id: binnacle-tool-cards
      name: 'binnacle/plugins/tool-cards'
    - id: binnacle-trajectory
      name: 'binnacle/plugins/trajectory'
    # dsh-base serves the questions an agent asks (user-questions) but loads no
    # tool to ask them with; dsh's web app adds this one. binnacle answers
    # questions in the composer's seat, so it lets the agent ask them.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
