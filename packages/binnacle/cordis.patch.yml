# The binnacle bundle, stacked by a profile over dsh-base.
#
# binnacle holds the terminal for the life of the process, so a
# configuration reload must not swap rows under a live frame: HMR is off,
# as it is in dsh's own direct-driver bundles (headless, ACP, SDK).
- id: hmr
  disabled: true

- insert:
    - id: binnacle
      name: 'binnacle'
    # binnacle's built-in features, each a row of its own so a person can
    # remove one as they remove any dsh plugin: disable it by its id in their
    # own profile's patch (`- id: binnacle-status-line` / `disabled: true`).
    # Approvals and Questions are not rows: the host applies them on a scope
    # of the session's agent, which a row cannot be bound to.
    - id: binnacle-transcript
      name: 'binnacle/plugins/transcript'
    - id: binnacle-composer
      name: 'binnacle/plugins/composer'
    - id: binnacle-status-line
      name: 'binnacle/plugins/status-line'
    - id: binnacle-tool-cards
      name: 'binnacle/plugins/tool-cards'
    - id: binnacle-trajectory
      name: 'binnacle/plugins/trajectory'
    - id: binnacle-theme
      name: 'binnacle/plugins/theme'
    # Host-owned rows the presets read, as dsh's web bundle mounts them: the
    # opt-in every preset with delegation tools samples (`modelSelectionSettings:
    # true` publishes nothing a preset could own); the cordis host runner,
    # which publishes the inspect registry; and the process-global inspect
    # providers, registered once because their registry rejects a duplicate
    # id, which the `cordis` preset's `tool-cordis` row reads.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'
    # The preset registry. `default` names the preset a session opens on; the
    # shipped declarations follow as separate files under `presets/`, listed
    # after this file in `dsh.bundle.patch`.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

# The agent plane moves behind presets, as it does in dsh's web bundle: every
# row below composes what one agent contributes to the host registries — its
# tools, its prompt sections, its delegation backends — and binnacle's session
# opens its agent on the registry's default, so the base's process-wide copies
# would compose it a second time. Disabling rather than deleting is the web
# bundle's rule too: the base is shared, and a row absent from an overlay
# would silently reappear the day someone reorders the composition.
- id: tool-plugin-manager
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane (dsh-base's `jobs` row);
# only the model-facing `job_*` controls move, as the preset's `tool-jobs` row
# reads it.
- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

# The `skill` REGISTRY stays on the host plane; a preset's `skill-filesystem`
# registers into that preset's layer of it, and `tool-skill` is what a preset
# mounts to give its agent the catalog at all. dsh-base's host
# `skill-filesystem` row is disabled here so presets own local discovery: the
# `author` preset's row is where binnacle's `skills/` directory enters the
# catalog.
- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal service and session driver stay on the host plane (dsh-base's
# `goal` rows); presets own the human command and the model-facing tool.
- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane (dsh-base's `token-meter` row); the
# compaction backend that reads it moves, inside the preset's isolated
# compaction group.
- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends STAY on the host plane (dsh-base's
# `subagent` rows); what a preset chooses is which delegation TOOLS its agent
# sees.
- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

# dsh-base ships this row disabled; restating it keeps `tool-ralph` out of
# collision with every preset's row, as the web bundle restates it too.
- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true
