# The binnacle bundle, stacked by a profile over dsh-base.
# The agent is composed as dsh's headless bundle composes it: its persona and its tools mode.
- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Hot reload stays off until the core stays up while its plugins reload.
- id: hmr
  disabled: true

- insert:
    # The core: it owns the terminal, and provides the binnacle service.
    - id: binnacle
      name: 'binnacle'
    # The transcript: the session's events, raw.
    - id: binnacle-transcript
      name: 'binnacle/plugins/transcript'
    # The composer: what a person types, before it is sent.
    - id: binnacle-composer
      name: 'binnacle/plugins/composer'
    # The status line: whether the agent runs, and on which model.
    - id: binnacle-status-line
      name: 'binnacle/plugins/status-line'
    # The Requests: the approvals and the questions that stand, and the talk with dsh. It draws nothing.
    - id: binnacle-requests
      name: 'binnacle/plugins/requests'
    # The Requests' default view: a tool asks for an approval, or the agent asks a question, and a person answers.
    - id: binnacle-requests-view
      name: 'binnacle/plugins/requests-view'
    # The tool the agent asks through, in its blocking mode, as dsh's standard preset composes it.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
