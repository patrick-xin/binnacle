name: Gap
description: Something a person cannot do, or that binnacle does wrong.
labels: [gap]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: One or two sentences, from the person's side of the screen.
    validations:
      required: true
  - type: textarea
    id: reading
    attributes:
      label: The reading
      description: How it was found — a probe, a test, or a reference read (cite it as `name:path`).
    validations:
      required: true
  - type: input
    id: lands
    attributes:
      label: Where the fix would land
      description: The layer and module, if known.
