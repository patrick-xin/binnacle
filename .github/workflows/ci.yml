name: ci

# Run by hand while the repository is private; a push to main and a pull request run it once it is public.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm refs
      - run: pnpm test
      - name: Install the dsh launcher at the pin
        run: npm install --global "@deepseek-ai/dsh@$(node -p "require('./references.json').dsh.tag.replace(/^dsh-v/, '')")"
      - run: pnpm dsh:profile
      - run: pnpm check:boot
